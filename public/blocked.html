<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnoFox – Seite blockiert</title>
<style>
  :root { --bg:#fff4f1; --card:#ffffff; --text:#2a1612; --muted:#7a5148; --danger:#b3261e; --border:#f0c9c0; --accent:#0d6b5f; --btn:#f5e3de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d0f0c; --card:#2a1713; --text:#fbeae6; --muted:#d3a79c; --danger:#ff8a80; --border:#5a2e26; --accent:#6ad7b0; --btn:#3a201b; } }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  main { max-width:560px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { color:var(--danger); font-size:22px; margin:0 0 8px; }
  .host { font:600 15px ui-monospace, monospace; word-break:break-all; background:var(--btn); padding:6px 10px; border-radius:8px; display:inline-block; margin:6px 0; }
  p { margin:8px 0; } .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center; }
  button, select { font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:var(--btn); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  details { margin-top:18px; } summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Seite blockiert</h1>
  <p id="reason"></p>
  <p><span class="host" id="host"></span></p>
  <p class="muted" id="source"></p>
  <div class="row"><button type="button" class="primary" id="back">Zurück in Sicherheit</button></div>
  <details>
    <summary>Ich weiß, was ich tue</summary>
    <p class="muted">Die Seite wird ohne Schutz vor dieser Liste geöffnet. Andere AnoFox-Schutzfunktionen bleiben aktiv.</p>
    <div class="row">
      <select id="duration" aria-label="Dauer der Freigabe"><option value="10">für 10 Minuten</option><option value="session">bis Browserende</option></select>
      <button type="button" id="proceed">Trotzdem öffnen</button>
    </div>
  </details>
  <p class="muted">AnoFox prüft Adressen nur lokal gegen heruntergeladene Listen. Es wird keine besuchte Adresse an einen Dienst gesendet.</p>
</main>
<script src="blocked.js"></script>
</body>
</html>
