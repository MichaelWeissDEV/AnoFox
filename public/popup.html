<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnoFox</title>
<style>
  html, body { width: 360px; max-width: 100%; }
  body { padding: 0 0 12px; font-size: 14px; }
  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
  .p-head .brand img { width: 28px; height: 28px; }
  .p-head h1 { font-size: 17px; margin: 0; }
  .icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 16px; padding: 0; }
  .icon-btn:hover { background: var(--bg-card-hover); }
  main { padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px; }
  section.ui-card { padding: 12px 14px; }
  section h2 { font-size: 13px; margin: 0 0 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .site-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .site-domain { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .badge { display: inline-flex; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-muted); margin: 6px 6px 0 0; }
  .badge.active { color: var(--success); border-color: var(--success); }
  .btn-accent, button.btn-accent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .full { width: 100%; }
  .site-rules { margin-top: 6px; font-size: 12px; color: var(--text-muted); }
  .site-rules div { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 0; }
  .site-rules button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0 8px; min-height: 28px; }
  select { max-width: 100%; }
  #status { min-height: 20px; margin: 0; padding: 0 14px; font-size: 13px; color: var(--text-muted); }
  footer { text-align: center; color: var(--text-muted); font-size: 12px; padding: 6px 14px 0; }
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<header class="p-head">
  <div class="brand"><img src="icons/icon-48.png" alt="" width="28" height="28"><h1>AnoFox</h1></div>
  <div class="ui-row">
    <button type="button" class="icon-btn" id="theme-toggle-btn" aria-label="Design umschalten (Hell/Dunkel)" title="Design umschalten">&#9728;</button>
    <button type="button" class="icon-btn" id="btn-open-options-icon" aria-label="Alle Einstellungen in neuem Tab öffnen" title="Einstellungen">&#9881;</button>
  </div>
</header>

<main>
  <section class="ui-card" aria-labelledby="h-site">
    <h2 id="h-site">Diese Website</h2>
    <div class="site-row">
      <span class="site-domain" id="current-domain">Lade Seite…</span>
      <button type="button" id="toggle-site-btn" class="ui-btn btn-sm" disabled>Ausnahme</button>
    </div>
    <div><span class="badge" id="badge-cleaner">Cleaner: Aktiv</span><span class="badge" id="badge-embed">Embeds: Geschützt</span></div>
  </section>

  <section class="ui-card" aria-labelledby="h-profile">
    <h2 id="h-profile">Schutzprofil (alle Websites)</h2>
    <label class="sr-only" for="profile-select">Schutzprofil</label>
    <select id="profile-select" class="full">
      <option value="balanced">Balanced</option>
      <option value="strict">Strict</option>
      <option value="lockdown">Lockdown</option>
      <option value="custom" disabled>Custom</option>
    </select>
    <p class="ui-muted" id="profile-desc" style="margin:6px 0 0"></p>
  </section>

  <section class="ui-card" aria-labelledby="h-actions">
    <h2 id="h-actions">Ausnahmen für diese Website</h2>
    <div class="stack">
      <label class="ui-muted" for="site-rule-duration">Dauer</label>
      <select id="site-rule-duration" class="full">
        <option value="tab">Bis Tab geschlossen</option>
        <option value="session">Bis Browserende</option>
        <option value="permanent">Dauerhaft</option>
      </select>
      <button type="button" id="btn-allow-scripts" class="ui-btn full" disabled>Skripte hier erlauben</button>
      <button type="button" id="btn-pause-adblock" class="ui-btn full" disabled>Werbeblocker hier pausieren</button>
      <button type="button" id="btn-pause-consent" class="ui-btn full" disabled>Banner-Automatik hier aus</button>
    </div>
    <div id="site-rules" class="site-rules" aria-live="polite"></div>
    <div class="stack" style="margin-top:10px">
      <label for="site-policy-select"><strong>Cookies &amp; Daten dieser Website</strong></label>
      <select id="site-policy-select" class="full" disabled>
        <option value="">Standard</option>
        <option value="persistent">Persistent (behalten)</option>
        <option value="session">Session (beim Neustart löschen)</option>
        <option value="ephemeral">Ephemeral (nach dem Schließen löschen)</option>
      </select>
      <span class="ui-muted" id="site-policy-desc">Cookies &amp; Speicher</span>
    </div>
  </section>

  <section class="ui-card" aria-labelledby="h-switches">
    <h2 id="h-switches">Schnellschalter</h2>
    <label class="ui-switch"><input type="checkbox" role="switch" id="cleaner-enabled" checked><span class="track" aria-hidden="true"></span>
      <span class="ui-switch__text"><span class="ui-switch__label">URL-Tracking-Bereinigung</span><span class="ui-muted">Entfernt utm_*, fbclid und weitere Parameter.</span></span></label>
    <label class="ui-switch"><input type="checkbox" role="switch" id="embeds-enabled" checked><span class="track" aria-hidden="true"></span>
      <span class="ui-switch__text"><span class="ui-switch__label">Social Embed Guard</span><span class="ui-muted">Blockiert Social-Media-Einbettungen vor dem Netzwerkstart.</span></span></label>
    <label class="ui-switch"><input type="checkbox" role="switch" id="terminal-logging" checked><span class="track" aria-hidden="true"></span>
      <span class="ui-switch__text"><span class="ui-switch__label">[AnoFox] Konsole-Logs</span><span class="ui-muted">Ausgabe mit [AnoFox]-Präfix.</span></span></label>
    <label class="ui-switch"><input type="checkbox" role="switch" id="stats-enabled"><span class="track" aria-hidden="true"></span>
      <span class="ui-switch__text"><span class="ui-switch__label">Temporäre Statistik</span><span class="ui-muted" id="stats-summary-desc">Standard: Aus, nur im Arbeitsspeicher.</span></span></label>
  </section>

  <button type="button" id="btn-open-options" class="ui-btn ui-btn--primary full">Alle Einstellungen öffnen</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>

<footer>AnoFox &bull; Lokale Privatsphäre ohne Cloud</footer>

<script src="popup.js"></script>
</body>
</html>
